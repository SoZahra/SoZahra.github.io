<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <!-- Pendant Halloween, renvoie vers la version jeu (jeu.html) -->
  <script src="js/saison.js" data-page="classique"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Fatima Zayani — Designer UI/UX & développeuse</title>
  <meta name="description" content="Portfolio de Fatima Zayani, designer UI/UX et développeuse : projets, parcours et contact, en une page.">
  <meta name="theme-color" content="#c9c9c7">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap">
  <link rel="stylesheet" href="css/express.css">

  <!-- Version classique du portfolio : une seule page, servie toute l'année
       sauf à Halloween. Mêmes données que la version jeu (jeu.html). -->
  <script src="js/projets.js" defer></script>
  <script src="js/whoami.js" defer></script>
  <script src="js/contact.js" defer></script>
  <script type="module" src="js/express.js"></script>
</head>
<body>
  <a class="evitement" href="#projets">Aller aux projets</a>

  <!-- Curseur personnalisé (souris seulement) -->
  <div class="curseur" id="curseur" aria-hidden="true"><span id="curseur-texte"></span></div>

  <header class="entete">
    <!-- Ses yeux (frange noire, eye-liner) : les pupilles suivent la souris -->
    <a class="yeux" id="yeux" href="#haut" aria-label="Fatima Zayani, haut de page">
      <span class="yeux-carte">
      <span class="yeux-face yeux-recto">
      <svg viewBox="0 0 72 34" aria-hidden="true" focusable="false">
        <defs>
          <clipPath id="oeil-g"><path d="M8 23 Q19 13 30 23 Q19 31 8 23 Z"/></clipPath>
          <clipPath id="oeil-d"><path d="M42 23 Q53 13 64 23 Q53 31 42 23 Z"/></clipPath>
        </defs>
        <!-- frange : haut arrondi, mèches qui tombent juste au-dessus des yeux -->
        <path d="M1 16 C1 5 15 0.5 36 0.5 C57 0.5 71 5 71 16 Q68.8 17.6 66.7 14.9 Q64.5 17.5 62.3 14.6 Q60.4 17.5 58.4 14.7 Q56.0 16.9 53.6 14.4 Q51.7 17.9 49.8 14.7 Q48.0 18.2 46.2 15.0 Q43.8 17.7 41.5 14.2 Q39.7 17.5 37.9 14.2 Q35.9 17.1 34.0 14.1 Q31.8 17.4 29.6 14.9 Q27.4 17.7 25.2 14.5 Q22.9 17.4 20.5 14.4 Q17.9 18.2 15.4 14.9 Q13.0 17.2 10.6 14.3 Q8.6 16.9 6.6 14.8 Q4.4 18.0 2.3 14.4 Q1.7 18.0 1.0 14.1 Z" fill="#111"/>
        <g class="oeil">
          <path d="M8 23 Q19 13 30 23 Q19 31 8 23 Z" fill="#fff"/>
          <g clip-path="url(#oeil-g)"><g class="iris">
            <circle cx="19" cy="23" r="5.2" fill="#3b2a22"/>
            <circle cx="19" cy="23" r="2.4" fill="#111"/>
            <circle cx="20.4" cy="21.6" r="1" fill="#fff"/>
          </g></g>
          <path d="M8 23 Q19 13 30 23 Q19 31 8 23 Z" fill="none" stroke="#111" stroke-width="1.6"/>
        </g>
        <g class="oeil">
          <path d="M42 23 Q53 13 64 23 Q53 31 42 23 Z" fill="#fff"/>
          <g clip-path="url(#oeil-d)"><g class="iris">
            <circle cx="53" cy="23" r="5.2" fill="#3b2a22"/>
            <circle cx="53" cy="23" r="2.4" fill="#111"/>
            <circle cx="54.4" cy="21.6" r="1" fill="#fff"/>
          </g></g>
          <path d="M42 23 Q53 13 64 23 Q53 31 42 23 Z" fill="none" stroke="#111" stroke-width="1.6"/>
        </g>
        <!-- eye-liner : trait épais en haut, étiré vers l'extérieur -->
        <path d="M30 23 Q19 13.2 8 23 L3 18.5 Q6 20 8.6 21.2" fill="none" stroke="#111" stroke-width="2.4" stroke-linejoin="round"/>
        <path d="M42 23 Q53 13.2 64 23 L69 18.5 Q66 20 63.4 21.2" fill="none" stroke="#111" stroke-width="2.4" stroke-linejoin="round"/>
      </svg>
      </span>
      <span class="yeux-face yeux-nom" aria-hidden="true">Fatima<br>Zayani</span>
      </span>
    </a>
    <!-- Navigation verticale, à droite ; au survol, le mot roule -->
    <nav class="nav-verticale" aria-label="Navigation principale">
      <ul>
        <li><a href="#projets"><span data-texte="Projets">Projets</span></a></li>
        <li><a href="#apropos"><span data-texte="À propos">À propos</span></a></li>
        <li><a href="#contact"><span data-texte="Contact">Contact</span></a></li>
      </ul>
    </nav>
    <a class="vers-immersif lien-jeu" href="jeu.html"><span data-texte="Version immersive ↗">Version immersive ↗</span></a>
  </header>

  <!-- La colonne : texte vertical qui accompagne toute la visite. Centrée à
       l'accueil, elle glisse à gauche au défilement et change de texte
       selon la section (js/express.js). Décorative : le vrai texte est
       dans les sections. -->
  <div class="colonne" id="colonne" aria-hidden="true">
    <span class="colonne-mot" data-place="a"></span>
    <span class="colonne-mot" data-place="b"></span>
    <span class="colonne-mot" data-place="c"></span>
    <span class="colonne-mot" data-place="d"></span>
    <span class="colonne-mot" data-place="e"></span>
  </div>

  <main id="haut">
    <!-- ===================== ACCUEIL + PROJETS =====================
         Une seule scène (js/express-paquet.js) : à l'accueil, les cartes des
         projets flottent, floues, et avancent vers nous derrière la colonne.
         Au défilement, elles se rangent en paquet pendant que la colonne
         glisse à gauche, puis on feuillette : la carte du dessus s'envole. -->
    <section class="projets" id="accueil" aria-labelledby="nom">
      <!-- cible des liens « Projets » : la fin de l'approche -->
      <span class="ancre-projets" id="projets" aria-hidden="true"></span>
      <div class="projets-scene">
        <h1 class="sr-only" id="nom">Fatima Zayani</h1>
        <p class="sr-only" id="classe"></p>
        <h2 class="sr-only" id="titre-projets">Projets</h2>
        <canvas class="paquet" id="paquet" aria-hidden="true"></canvas>
        <div class="etiquettes" id="etiquettes" aria-hidden="true"></div>
        <p class="sr-only" id="projet-actif" aria-live="polite"></p>
        <a class="accueil-indice" id="accueil-indice" href="#projets">Défile <span aria-hidden="true">↓</span></a>
        <div class="projets-bas" id="projets-bas">
          <ol class="projets-liste" id="projets-liste" aria-label="Aller au projet"></ol>
          <button type="button" class="bouton" id="projet-ouvrir">Voir le projet</button>
        </div>
      </div>
    </section>

    <!-- ===================== À PROPOS ===================== -->
    <section class="apropos" id="apropos" aria-labelledby="titre-apropos">
      <div class="panneau">
        <h2 id="titre-apropos">À propos</h2>
        <p class="devise" id="devise"></p>
        <div class="apropos-grille">
          <div id="histoire" class="histoire"></div>
          <div>
            <h3>Outils</h3>
            <ul class="etiquettes" id="competences"></ul>
            <h3>Parcours</h3>
            <ol class="parcours" id="parcours"></ol>
          </div>
        </div>
      </div>
    </section>

    <!-- ===================== CONTACT ===================== -->
    <section class="contact" id="contact" aria-labelledby="titre-contact">
      <h2 id="titre-contact">Un projet ? <em>Écris-moi.</em></h2>
      <div class="contact-ligne">
        <a class="email" id="email" data-curseur="Écrire"></a>
        <button type="button" class="bouton" id="copier">Copier l'adresse</button>
        <span class="copie-ok" id="copie-ok" role="status"></span>
      </div>
      <ul class="liens" id="liens"></ul>
    </section>
  </main>

  <footer class="pied">
    <span>© <span id="annee"></span> Fatima Zayani</span>
    <a class="lien-jeu" href="jeu.html">Revivre l'intro immersive <span aria-hidden="true">↗</span></a>
    <a href="CREDITS.md">Crédits</a>
  </footer>

  <!-- Fiche d'un projet -->
  <dialog class="fiche" id="fiche" aria-labelledby="fiche-titre">
    <button type="button" class="fiche-fermer" id="fiche-fermer" aria-label="Fermer">✕</button>
    <div id="fiche-contenu"></div>
  </dialog>
</body>
</html>
