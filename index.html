<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coming soon</title>
  <style>
    @font-face {
      font-family: "Cinzel";
      src: url("fonts/Cinzel-VariableFont_wght.ttf") format("truetype");
      font-weight: 400 900;
      font-display: swap;
    }

    html, body {
      height: 100%;
      margin: 0;
    }

    body {
      background: #000;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #fireflies {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .title {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
    }

    .ornament {
      display: block;
      width: 100%;
      filter: invert(1);
    }

    h1 {
      font-family: "Cinzel", serif;
      font-size: clamp(2rem, 9vw, 5.5rem);
      font-weight: normal;
      text-align: center;
      margin: 0;
    }
  </style>
</head>
<body>
  <canvas id="fireflies"></canvas>
  <div class="title">
    <img class="ornament" src="images/ornament-top.svg" alt="">
    <h1>Coming soon</h1>
    <img class="ornament" src="images/ornament-bottom.svg" alt="">
  </div>

  <script>
    (() => {
      if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;

      const canvas = document.getElementById("fireflies");
      const ctx = canvas.getContext("2d");
      const COUNT = 40;
      let w, h, flies;

      function resize() {
        const dpr = window.devicePixelRatio || 1;
        w = innerWidth;
        h = innerHeight;
        canvas.width = w * dpr;
        canvas.height = h * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      function spawn() {
        return {
          x: Math.random() * w,
          y: Math.random() * h,
          r: 1 + Math.random() * 1.5,
          angle: Math.random() * Math.PI * 2,
          speed: 0.15 + Math.random() * 0.35,
          phase: Math.random() * Math.PI * 2,
          blink: 0.01 + Math.random() * 0.02,
        };
      }

      function tick() {
        ctx.clearRect(0, 0, w, h);
        for (const f of flies) {
          f.angle += (Math.random() - 0.5) * 0.2;
          f.x += Math.cos(f.angle) * f.speed;
          f.y += Math.sin(f.angle) * f.speed;
          if (f.x < -10) f.x = w + 10;
          if (f.x > w + 10) f.x = -10;
          if (f.y < -10) f.y = h + 10;
          if (f.y > h + 10) f.y = -10;

          f.phase += f.blink;
          const alpha = 0.2 + 0.8 * Math.max(0, Math.sin(f.phase));

          const glow = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.r * 8);
          glow.addColorStop(0, `rgba(255, 230, 140, ${alpha})`);
          glow.addColorStop(1, "rgba(255, 230, 140, 0)");
          ctx.fillStyle = glow;
          ctx.beginPath();
          ctx.arc(f.x, f.y, f.r * 8, 0, Math.PI * 2);
          ctx.fill();
        }
        requestAnimationFrame(tick);
      }

      resize();
      flies = Array.from({ length: COUNT }, spawn);
      addEventListener("resize", resize);
      tick();
    })();
  </script>
</body>
</html>
